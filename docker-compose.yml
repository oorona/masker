# Single Postgres container hosting all three PoC databases:
#   "fintechP" - production data (sensitive, seeded with mock PII)
#   "fintechT" - test data (same schema, starts empty; filled with masked rows)
#   bus        - shared mailbox the two Pi agents communicate through
#
# Optional services (compose profiles; enable with --profile or COMPOSE_PROFILES):
#   ui      - the bus monitor web UI + control plane (pi/ui): shows the agents
#             talking and starts/stops the model-free agents and seeds/resets the
#             databases from the page (MASKER_CONTROL=1)
#   seed    - one-shot: seed fintechP from a container (no local Python needed)
#             docker compose run --rm masker-seed [--customers N] [--append]
services:
  masker-db:
    image: postgres:16
    container_name: masker-db
    environment:
      POSTGRES_USER: masker
      POSTGRES_PASSWORD: masker
      POSTGRES_DB: masker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - masker-pgdata:/var/lib/postgresql/data
      # Init scripts run once, in alphabetical order, on first boot of an empty volume.
      - ./db/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
      - ./db/02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      # Shared table DDL — mounted but NOT in initdb.d, so it only runs when
      # 02-schema.sql \i-includes it (once per data database).
      - ./db/bank-ddl.sql:/sql/bank-ddl.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masker -d masker"]
      interval: 3s
      timeout: 3s
      retries: 10
    # Single-homed on the project network only. (Attaching it to a second network
    # such as `dbnet` breaks the host-published 5432 port via asymmetric return
    # routing — host clients see "server terminated abnormally". The local pgAdmin
    # below shares this network, so it reaches the DB by name without that.)
    networks:
      - default

  # Local pgAdmin for THIS project. Published on localhost only, on the same
  # network as the db, with the masker server pre-registered. Open it at
  # http://localhost:5050  (login: admin@masker.local / masker).
  masker-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: masker-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@masker.com
      PGADMIN_DEFAULT_PASSWORD: masker
      # Server mode so the default user exists and servers.json is auto-imported
      # for it on first boot. Master password off so it never prompts for one.
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"                          # localhost-only
    volumes:
      - masker-pgadmin:/var/lib/pgadmin
      - ./db/pgadmin-servers.json:/pgadmin4/servers.json:ro   # auto-register masker-db
    depends_on:
      masker-db:
        condition: service_healthy
    networks:
      - default

  # Bus monitor + control plane. The page starts/stops the prod emulator (child
  # process, pi/tools/prod-emulator.mjs) and the in-process test agent, and runs
  # db/seed.py / truncates for the database buttons. MASKER_CONTROL=0 makes it a
  # pure observer. Published on localhost:5056 so it never collides with
  # ./pi/ui/run.sh (5055); the home overlay exposes it through Traefik instead.
  masker-ui:
    build:
      context: .
      dockerfile: pi/Dockerfile
    image: masker-ui
    container_name: masker-ui
    profiles: ["ui"]
    restart: unless-stopped
    init: true
    # Canon hardening block: non-root, read-only rootfs, no capabilities.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 512m
    tmpfs:
      - /tmp:size=64m,uid=${APP_UID:-1000},gid=${APP_GID:-1000}
    environment:
      MASKER_UI_HOST: 0.0.0.0
      MASKER_UI_PORT: "5055"
      MASKER_CONTROL: ${MASKER_CONTROL:-1}
      BUS_URL: postgresql://masker:masker@masker-db:5432/bus
      TEST_PG_URL: postgresql://masker:masker@masker-db:5432/fintechT
      MASKER_PROD_URL: postgresql://masker:masker@masker-db:5432/fintechP   # count(*) + handed to the workers
    ports:
      - "127.0.0.1:${MASKER_UI_PUBLISH_PORT:-5056}:5055"
    depends_on:
      masker-db:
        condition: service_healthy
    networks:
      - default

  # One-shot seeder (Faker) so a host without Python can fill fintechP:
  #   docker compose run --rm masker-seed              # wipe + reseed prod
  #   docker compose run --rm masker-seed --append --customers 5
  masker-seed:
    image: python:3.13-slim
    profiles: ["seed"]
    environment:
      MASKER_PROD_URL: postgresql://masker:masker@masker-db:5432/fintechP
      PIP_ROOT_USER_ACTION: ignore
    volumes:
      - ./db:/db:ro
    entrypoint: ["sh", "-c", "pip install -q -r /db/requirements.txt && exec python /db/seed.py \"$@\"", "--"]
    depends_on:
      masker-db:
        condition: service_healthy
    networks:
      - default

volumes:
  masker-pgdata:
  masker-pgadmin:
